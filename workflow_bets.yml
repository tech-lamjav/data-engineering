# ============================================================
# WORKFLOW BETS
# Extração de player props e betting odds + dbt + notificação
# ============================================================

main:
    steps:

    # ============================================================================
    # INICIALIZAÇÃO
    # ============================================================================
    - init:
        assign:
        - workflow_start_time: ${sys.now()}
        - execution_id: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
        - workflow_status: "SUCCESS"
        - failed_services: []
        - dbt_ok: true

    - log_start:
        call: sys.log
        args:
            severity: INFO
            data:
                message: "Workflow execution started"
                workflow_name: "workflow_bets"
                execution_id: ${execution_id}
                start_time: ${workflow_start_time}

    # ============================================================================
    # FASE 1: Extração de player props e betting odds (4 services em paralelo)
    # Cada branch tem seu próprio try/except e escreve em failed_services (shared)
    # ============================================================================
    - phase1_initial_extraction:
        steps:
        - extract_vendors_parallel:
            parallel:
              shared: [failed_services, workflow_status]
              branches:
                - draftkings_branch:
                    steps:
                    - call_extract_draftkings:
                        try:
                            call: http.get
                            args:
                                url: https://extract-player-props-draftkings-r52p4w2f2a-ue.a.run.app
                                auth:
                                    type: OIDC
                                timeout: 1800
                        # Retry com backoff exponencial: reexecuta em 429/5xx/timeout/erro de conexão.
                        retry:
                            predicate: ${http.default_retry_predicate}
                            max_retries: 3
                            backoff:
                                initial_delay: 5
                                max_delay: 60
                                multiplier: 2
                        except:
                            as: e
                            steps:
                            - log_draftkings_error:
                                call: sys.log
                                args:
                                    severity: ERROR
                                    data:
                                        message: "extract-player-props-draftkings failed"
                                        error: ${e.message}
                            - handle_draftkings_error:
                                assign:
                                - workflow_status: "PARTIAL_FAILURE"
                                - failed_services: ${list.concat(failed_services, ["extract-player-props-draftkings"])}
                - caesars_branch:
                    steps:
                    - call_extract_caesars:
                        try:
                            call: http.get
                            args:
                                url: https://extract-player-props-caesars-r52p4w2f2a-ue.a.run.app
                                auth:
                                    type: OIDC
                                timeout: 1800
                        # Retry com backoff exponencial: reexecuta em 429/5xx/timeout/erro de conexão.
                        retry:
                            predicate: ${http.default_retry_predicate}
                            max_retries: 3
                            backoff:
                                initial_delay: 5
                                max_delay: 60
                                multiplier: 2
                        except:
                            as: e
                            steps:
                            - log_caesars_error:
                                call: sys.log
                                args:
                                    severity: ERROR
                                    data:
                                        message: "extract-player-props-caesars failed"
                                        error: ${e.message}
                            - handle_caesars_error:
                                assign:
                                - workflow_status: "PARTIAL_FAILURE"
                                - failed_services: ${list.concat(failed_services, ["extract-player-props-caesars"])}
                - betrivers_branch:
                    steps:
                    - call_extract_betrivers:
                        try:
                            call: http.get
                            args:
                                url: https://extract-player-props-betrivers-r52p4w2f2a-ue.a.run.app
                                auth:
                                    type: OIDC
                                timeout: 1800
                        # Retry com backoff exponencial: reexecuta em 429/5xx/timeout/erro de conexão.
                        retry:
                            predicate: ${http.default_retry_predicate}
                            max_retries: 3
                            backoff:
                                initial_delay: 5
                                max_delay: 60
                                multiplier: 2
                        except:
                            as: e
                            steps:
                            - log_betrivers_error:
                                call: sys.log
                                args:
                                    severity: ERROR
                                    data:
                                        message: "extract-player-props-betrivers failed"
                                        error: ${e.message}
                            - handle_betrivers_error:
                                assign:
                                - workflow_status: "PARTIAL_FAILURE"
                                - failed_services: ${list.concat(failed_services, ["extract-player-props-betrivers"])}
                - betting_odds_branch:
                    steps:
                    - call_extract_betting_odds:
                        try:
                            call: http.get
                            args:
                                url: https://extract-betting-odds-r52p4w2f2a-ue.a.run.app
                                auth:
                                    type: OIDC
                                timeout: 1800
                        # Retry com backoff exponencial: reexecuta em 429/5xx/timeout/erro de conexão.
                        retry:
                            predicate: ${http.default_retry_predicate}
                            max_retries: 3
                            backoff:
                                initial_delay: 5
                                max_delay: 60
                                multiplier: 2
                        except:
                            as: e
                            steps:
                            - log_betting_odds_error:
                                call: sys.log
                                args:
                                    severity: ERROR
                                    data:
                                        message: "extract-betting-odds failed"
                                        error: ${e.message}
                            - handle_betting_odds_error:
                                assign:
                                - workflow_status: "PARTIAL_FAILURE"
                                - failed_services: ${list.concat(failed_services, ["extract-betting-odds"])}

    # ============================================================================
    # FASE 2: Cloud Run Job execution (dbt-nba)
    # ============================================================================
    - phase2_cloud_run_job:
        try:
            steps:
            - init_job_config:
                assign:
                - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
                - job_name: "dbt-nba"
                - job_location: "us-east1"
                - job_full_name: ${"projects/" + project_id + "/locations/" + job_location + "/jobs/" + job_name}

            - log_job_start:
                call: sys.log
                args:
                    severity: INFO
                    data:
                        message: "Starting Cloud Run Job execution"
                        job_name: ${job_name}

            - execute_cloud_run_job:
                try:
                    call: googleapis.run.v2.projects.locations.jobs.run
                    args:
                        name: ${job_full_name}
                        body:
                            overrides:
                                containerOverrides:
                                    - args: ["dbt", "run", "--select", "stg_betting_odds+ stg_player_props+", "--project-dir", "/app/dbt_nba", "--profiles-dir", "/app/.dbt", "--target", "prod"]
                    result: job_execution_result
                # Retry com backoff exponencial: reexecuta em 429/5xx/timeout/erro de conexão.
                retry:
                    predicate: ${http.default_retry_predicate}
                    max_retries: 3
                    backoff:
                        initial_delay: 5
                        max_delay: 60
                        multiplier: 2

            - log_job_success:
                call: sys.log
                args:
                    severity: INFO
                    data:
                        message: "Cloud Run Job executed successfully"
                        job_name: ${job_name}
                        execution_name: ${job_execution_result.name}
        except:
            as: e
            steps:
            - log_job_error:
                call: sys.log
                args:
                    severity: ERROR
                    data:
                        message: "Cloud Run Job execution failed"
                        job_name: "dbt-nba"
                        error: ${e.message}
            - handle_job_errors:
                assign:
                - workflow_status: "PARTIAL_FAILURE"
                - failed_services: ${list.concat(failed_services, ["dbt-nba"])}
                - dbt_ok: false

    # ============================================================================
    # FASE 3: Sync parcial das marts afetadas por bets/props (PRD + DEV)
    # try/except independentes por ambiente.
    # GATE: o sync PRD só roda se o dbt (fase 2) teve sucesso — não publicar marts
    # potencialmente desatualizadas/parciais em produção quando o dbt falhou.
    # ============================================================================
    - phase3_sync_bets_prd_gate:
        switch:
            - condition: ${dbt_ok}
              next: phase3_sync_bets_prd
        next: skip_phase3_bets_prd_sync

    - phase3_sync_bets_prd:
        try:
            steps:
            - call_sync_bets_prd:
                try:
                    call: http.get
                    args:
                        url: https://sync-bq-to-postgres-r52p4w2f2a-ue.a.run.app?env=prd&tables=dim_player_latest_line,ft_game_player_stats,dim_daily_opportunities
                        auth:
                            type: OIDC
                            audience: https://sync-bq-to-postgres-r52p4w2f2a-ue.a.run.app
                        timeout: 600
                # Retry com backoff exponencial: reexecuta em 429/5xx/timeout/erro de conexão.
                retry:
                    predicate: ${http.default_retry_predicate}
                    max_retries: 3
                    backoff:
                        initial_delay: 5
                        max_delay: 60
                        multiplier: 2
            - log_phase3_bets_prd_success:
                call: sys.log
                args:
                    severity: INFO
                    data:
                        message: "Phase 3 sync bets PRD completed successfully"
        except:
            as: e
            steps:
            - log_phase3_bets_prd_error:
                call: sys.log
                args:
                    severity: ERROR
                    data:
                        message: "Phase 3 sync bets PRD failed"
                        error: ${e.message}
            - handle_phase3_bets_prd_errors:
                assign:
                - workflow_status: "PARTIAL_FAILURE"
                - failed_services: ${list.concat(failed_services, ["sync-bq-to-postgres[prd]"])}
        next: phase3_sync_bets_dev

    # Alcançado apenas quando o gate desvia (dbt falhou): registra o skip e segue p/ o DEV.
    - skip_phase3_bets_prd_sync:
        steps:
        - log_skip_phase3_bets_prd:
            call: sys.log
            args:
                severity: WARNING
                data:
                    message: "Phase 3 sync bets PRD PULADO: dbt-nba falhou; marts nao publicadas em producao"
                    failed_services: ${failed_services}
        - mark_phase3_bets_prd_skipped:
            assign:
            - failed_services: ${list.concat(failed_services, ["sync-bq-to-postgres[prd]:skipped(dbt-failed)"])}

    - phase3_sync_bets_dev:
        try:
            steps:
            - call_sync_bets_dev:
                try:
                    call: http.get
                    args:
                        url: https://sync-bq-to-postgres-r52p4w2f2a-ue.a.run.app?env=dev&tables=dim_player_latest_line,ft_game_player_stats,dim_daily_opportunities
                        auth:
                            type: OIDC
                            audience: https://sync-bq-to-postgres-r52p4w2f2a-ue.a.run.app
                        timeout: 600
                # Retry com backoff exponencial: reexecuta em 429/5xx/timeout/erro de conexão.
                retry:
                    predicate: ${http.default_retry_predicate}
                    max_retries: 3
                    backoff:
                        initial_delay: 5
                        max_delay: 60
                        multiplier: 2
            - log_phase3_bets_dev_success:
                call: sys.log
                args:
                    severity: INFO
                    data:
                        message: "Phase 3 sync bets DEV completed successfully"
        except:
            as: e
            steps:
            - log_phase3_bets_dev_error:
                call: sys.log
                args:
                    severity: ERROR
                    data:
                        message: "Phase 3 sync bets DEV failed"
                        error: ${e.message}
            - handle_phase3_bets_dev_errors:
                assign:
                - workflow_status: "PARTIAL_FAILURE"
                - failed_services: ${list.concat(failed_services, ["sync-bq-to-postgres[dev]"])}

    # ============================================================================
    # FINALIZAÇÃO
    # ============================================================================
    - finalize:
        assign:
        - workflow_end_time: ${sys.now()}
        - duration_seconds: ${workflow_end_time - workflow_start_time}
        - failed_count: ${len(failed_services)}

    - log_completion:
        call: sys.log
        args:
            severity: ${if(workflow_status == "SUCCESS", "INFO", "WARNING")}
            data:
                message: "Workflow execution completed"
                workflow_name: "workflow_bets"
                status: ${workflow_status}
                duration_seconds: ${duration_seconds}
                failed_services: ${failed_services}
                failed_count: ${failed_count}

    - return_result:
        return:
            status: ${workflow_status}
            duration_seconds: ${duration_seconds}
            failed_services: ${failed_services}
