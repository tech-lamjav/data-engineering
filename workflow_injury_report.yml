# ============================================================
# WORKFLOW INJURY REPORT
# Extrai lesões (extract_player_injuries) e executa job dbt-nba
# ============================================================

main:
    steps:

    # ============================================================================
    # INICIALIZAÇÃO
    # ============================================================================
    - init:
        assign:
        - workflow_start_time: ${sys.now()}
        - execution_id: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
        - workflow_status: "SUCCESS"
        - failed_services: []
        - dbt_ok: true

    - log_start:
        call: sys.log
        args:
            severity: INFO
            data:
                message: "Workflow execution started"
                workflow_name: "workflow_injury_report"
                execution_id: ${execution_id}
                start_time: ${workflow_start_time}

    # ============================================================================
    # FASE 1: Extração de lesões (player injuries)
    # ============================================================================
    - phase1_initial_extraction:
        try:
            steps:
            - call_extract_player_injuries:
                try:
                    call: http.get
                    args:
                        url: https://extract-player-injuries-r52p4w2f2a-ue.a.run.app
                        auth:
                            type: OIDC
                        timeout: 1800
                # Retry com backoff exponencial: reexecuta em 429/5xx/timeout/erro de conexão.
                retry:
                    predicate: ${http.default_retry_predicate}
                    max_retries: 3
                    backoff:
                        initial_delay: 5
                        max_delay: 60
                        multiplier: 2
            - log_phase1_success:
                call: sys.log
                args:
                    severity: INFO
                    data:
                        message: "Phase 1 completed successfully"
                        phase: "extract_player_injuries"
        except:
            as: e
            steps:
            - log_phase1_error:
                call: sys.log
                args:
                    severity: ERROR
                    data:
                        message: "Phase 1 encountered errors"
                        phase: "extract_player_injuries"
                        error: ${e.message}
            - handle_phase1_errors:
                assign:
                - workflow_status: "PARTIAL_FAILURE"
                - failed_services: ${list.concat(failed_services, ["extract-player-injuries"])}

    # ============================================================================
    # FASE 2: Cloud Run Job execution (dbt-nba)
    # ============================================================================
    - phase2_cloud_run_job:
        try:
            steps:
            - init_job_config:
                assign:
                - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
                - job_name: "dbt-nba"
                - job_location: "us-east1"
                - job_full_name: ${"projects/" + project_id + "/locations/" + job_location + "/jobs/" + job_name}

            - log_job_start:
                call: sys.log
                args:
                    severity: INFO
                    data:
                        message: "Starting Cloud Run Job execution"
                        job_name: ${job_name}

            - execute_cloud_run_job:
                try:
                    call: googleapis.run.v2.projects.locations.jobs.run
                    args:
                        name: ${job_full_name}
                        body:
                            overrides:
                                containerOverrides:
                                    - args: ["dbt", "run", "--select", "stg_player_injuries+ dim_teams+", "--project-dir", "/app/dbt_nba", "--profiles-dir", "/app/.dbt", "--target", "prod"]
                    result: job_execution_result
                # Retry com backoff exponencial: reexecuta em 429/5xx/timeout/erro de conexão.
                retry:
                    predicate: ${http.default_retry_predicate}
                    max_retries: 3
                    backoff:
                        initial_delay: 5
                        max_delay: 60
                        multiplier: 2

            - log_job_success:
                call: sys.log
                args:
                    severity: INFO
                    data:
                        message: "Cloud Run Job executed successfully"
                        job_name: ${job_name}
                        execution_name: ${job_execution_result.name}
        except:
            as: e
            steps:
            - log_job_error:
                call: sys.log
                args:
                    severity: ERROR
                    data:
                        message: "Cloud Run Job execution failed"
                        job_name: "dbt-nba"
                        error: ${e.message}
            - handle_job_errors:
                assign:
                - workflow_status: "PARTIAL_FAILURE"
                - failed_services: ${list.concat(failed_services, ["dbt-nba"])}
                - dbt_ok: false

    # ============================================================================
    # FASE 3: Sync parcial das marts afetadas pelo injury report (PRD + DEV)
    # try/except independentes por ambiente.
    # GATE: o sync PRD só roda se o dbt (fase 2) teve sucesso — não publicar marts
    # potencialmente desatualizadas/parciais em produção quando o dbt falhou.
    # ============================================================================
    - phase3_sync_injury_prd_gate:
        switch:
            - condition: ${dbt_ok}
              next: phase3_sync_injury_prd
        next: skip_phase3_injury_prd_sync

    - phase3_sync_injury_prd:
        try:
            steps:
            - call_sync_injury_prd:
                try:
                    call: http.get
                    args:
                        url: https://sync-bq-to-postgres-r52p4w2f2a-ue.a.run.app?env=prd&tables=dim_players,dim_teams,dim_stat_player,dim_daily_opportunities,dim_teammate_impact_360
                        auth:
                            type: OIDC
                            audience: https://sync-bq-to-postgres-r52p4w2f2a-ue.a.run.app
                        timeout: 600
                # Retry com backoff exponencial: reexecuta em 429/5xx/timeout/erro de conexão.
                retry:
                    predicate: ${http.default_retry_predicate}
                    max_retries: 3
                    backoff:
                        initial_delay: 5
                        max_delay: 60
                        multiplier: 2
            - log_phase3_injury_prd_success:
                call: sys.log
                args:
                    severity: INFO
                    data:
                        message: "Phase 3 sync injury PRD completed successfully"
        except:
            as: e
            steps:
            - log_phase3_injury_prd_error:
                call: sys.log
                args:
                    severity: ERROR
                    data:
                        message: "Phase 3 sync injury PRD failed"
                        error: ${e.message}
            - handle_phase3_injury_prd_errors:
                assign:
                - workflow_status: "PARTIAL_FAILURE"
                - failed_services: ${list.concat(failed_services, ["sync-bq-to-postgres[prd]"])}
        next: phase3_sync_injury_dev

    # Alcançado apenas quando o gate desvia (dbt falhou): registra o skip e segue p/ o DEV.
    - skip_phase3_injury_prd_sync:
        steps:
        - log_skip_phase3_injury_prd:
            call: sys.log
            args:
                severity: WARNING
                data:
                    message: "Phase 3 sync injury PRD PULADO: dbt-nba falhou; marts nao publicadas em producao"
                    failed_services: ${failed_services}
        - mark_phase3_injury_prd_skipped:
            assign:
            - failed_services: ${list.concat(failed_services, ["sync-bq-to-postgres[prd]:skipped(dbt-failed)"])}

    - phase3_sync_injury_dev:
        try:
            steps:
            - call_sync_injury_dev:
                try:
                    call: http.get
                    args:
                        url: https://sync-bq-to-postgres-r52p4w2f2a-ue.a.run.app?env=dev&tables=dim_players,dim_teams,dim_stat_player,dim_daily_opportunities,dim_teammate_impact_360
                        auth:
                            type: OIDC
                            audience: https://sync-bq-to-postgres-r52p4w2f2a-ue.a.run.app
                        timeout: 600
                # Retry com backoff exponencial: reexecuta em 429/5xx/timeout/erro de conexão.
                retry:
                    predicate: ${http.default_retry_predicate}
                    max_retries: 3
                    backoff:
                        initial_delay: 5
                        max_delay: 60
                        multiplier: 2
            - log_phase3_injury_dev_success:
                call: sys.log
                args:
                    severity: INFO
                    data:
                        message: "Phase 3 sync injury DEV completed successfully"
        except:
            as: e
            steps:
            - log_phase3_injury_dev_error:
                call: sys.log
                args:
                    severity: ERROR
                    data:
                        message: "Phase 3 sync injury DEV failed"
                        error: ${e.message}
            - handle_phase3_injury_dev_errors:
                assign:
                - workflow_status: "PARTIAL_FAILURE"
                - failed_services: ${list.concat(failed_services, ["sync-bq-to-postgres[dev]"])}

    # ============================================================================
    # FINALIZAÇÃO
    # ============================================================================
    - finalize:
        assign:
        - workflow_end_time: ${sys.now()}
        - duration_seconds: ${workflow_end_time - workflow_start_time}
        - failed_count: ${len(failed_services)}

    - log_completion:
        call: sys.log
        args:
            severity: ${if(workflow_status == "SUCCESS", "INFO", "WARNING")}
            data:
                message: "Workflow execution completed"
                workflow_name: "workflow_injury_report"
                status: ${workflow_status}
                duration_seconds: ${duration_seconds}
                failed_services: ${failed_services}
                failed_count: ${failed_count}

    - return_result:
        return:
            status: ${workflow_status}
            duration_seconds: ${duration_seconds}
            failed_services: ${failed_services}
