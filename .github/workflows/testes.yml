# Roda a suíte de testes (`pytest`) em todo PR — DE #55.
#
# Este repositório não tinha CI de teste nenhum antes deste workflow (os outros dois
# workflows daqui, `detector-atraso-sync.yml` e `contrato-serving.yml`, são detectores
# agendados, não testes de PR). O gatilho concreto é o auditor de fecho de imports
# (`tests/test_manifesto_fecho_de_imports.py`, DE #55): o manifesto de procedência
# apodrece para dentro sem um teste rodando em CI para pegar isso ANTES do merge.
#
# POR QUE INSTALA `functions-framework` À PARTE: só existe nos `requirements.txt` de
# cada `cloud_run/<svc>/`, não no da raiz (é dependência do wrapper HTTP do Cloud Run,
# não da extração em si). O auditor de fecho de imports resolve `functions_framework`
# como dependência externa via `importlib.util.find_spec` — sem instalar, o teste
# ainda passa graças a um fallback documentado, mas instalar aqui faz a checagem via
# `find_spec` valer de verdade em vez de cair no fallback.
name: testes

on:
  pull_request:
  push:
    branches: [master]

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependências
        run: |
          pip install -r requirements-dev.txt
          pip install functions-framework==3.10.2

      - name: pytest
        run: python -m pytest tests/ -v
