# ============================================================
# WORKFLOW FUTEBOL ODDS (pré-jogo / diária + T-24h, T-1h, T-15m)
# Poll das ODDS pré-jogo (coração do value betting) em 4 janelas por jogo: "daily" (de pouco
# além de 24h até 7 dias do apito — 1 captura por dia, date-stampada, é o que tira o board do
# recorte de 24 horas; adicionada em 2026-08-07), T-24h (linha de abertura), T-1h
# (intermediária) e T-15m (fechamento, CLV). Uma passada cobre todas — o
# extractor bucketa cada jogo NS pela proximidade do kickoff (FUTEBOL_ODDS_WINDOWS, bandas
# DISJUNTAS) e grava 1 arquivo por (fixture, janela) — por (fixture, janela, dia) na diária —
# com skip-if-exists. Se algo novo foi
# coletado, rebuild ENXUTO dos modelos de odds + Motor de Score no dbt-futebol
# (int_futebol_odds_devig / _corroboracao / _premissas_* -> fact_value_funnel -> fact_value_opportunities):
# a cada janela nova de odds o Score 1X2 + Gols O/U + Handicap asiático é recalculado com o edge/penalidades atualizados.
#
# Disparado pelo Cloud Scheduler a cada ~15min (SA schedulerde@, tem workflows.invoker).
# Sem notificação por email no sucesso (poll de alta frequência). Coleta FORWARD-ONLY (não
# dá pra reconstruir as janelas de jogos passados).
#
# O dbt usa --select SEM '+' (enxuto): a external table raw_futebol_odds é a fonte; o gate
# saved_count>0 garante que só roda com arquivo novo no GCS (external table não-vazia).
#
# FASE 3 (dbt snapshot, só se a fase 2 deu certo): versiona fact_value_opportunities_hist —
# histórico append-only por janela (t24h/t1h/t15m), pra não perder o pick de manhã quando a
# linha fecha e o mart (full-refresh) sobrescreve com o pick de t15m.
# ============================================================

main:
    steps:
    - init:
        assign:
        - workflow_start_time: ${sys.now()}
        - execution_id: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
        - workflow_status: "SUCCESS"
        # Status PRÓPRIO das guardas (spec #22): separado de workflow_status de propósito —
        # guarda vermelha reporta no e-mail diário sem marcar o workflow como PARTIAL_FAILURE
        # e sem bloquear board ou sync.
        - guardas_status: "SUCCESS"
        - saved_count: 0

    - log_start:
        call: sys.log
        args:
            severity: INFO
            data:
                message: "Workflow odds (pregame) started"
                workflow_name: "workflow_futebol_odds"
                execution_id: ${execution_id}

    # ========================================================================
    # FASE 1: Extração das odds (as 4 janelas numa passada — sem query param)
    # ========================================================================
    - phase1_extract_odds:
        try:
            steps:
            - call_extract_odds:
                try:
                    call: http.get
                    args:
                        # URL segue o padrão dos demais serviços futebol (confirmar pós-deploy)
                        url: https://extract-odds-r52p4w2f2a-ue.a.run.app
                        auth:
                            type: OIDC
                        timeout: 1800
                    result: odds_result
                # Retry com backoff exponencial: reexecuta em 429/5xx/timeout/erro de conexão.
                retry:
                    predicate: ${http.default_retry_predicate}
                    max_retries: 3
                    backoff:
                        initial_delay: 5
                        max_delay: 60
                        multiplier: 2
            - read_saved_count:
                assign:
                - saved_count: ${default(map.get(odds_result.body, "saved_count"), 0)}
            - log_phase1_success:
                call: sys.log
                args:
                    severity: INFO
                    data:
                        message: "Odds extraction completed"
                        saved_count: ${saved_count}
        except:
            as: e
            steps:
            - log_phase1_error:
                call: sys.log
                args:
                    severity: ERROR
                    data:
                        message: "Odds extraction failed"
                        error: ${e.message}
            - handle_phase1_errors:
                assign:
                - workflow_status: "PARTIAL_FAILURE"

    # ========================================================================
    # GATE: só roda o dbt se algo novo foi coletado (saved_count > 0).
    # ========================================================================
    - check_new_odds:
        switch:
            - condition: ${saved_count > 0}
              next: phase2_dbt
        next: skip_dbt

    - skip_dbt:
        steps:
        - log_skip:
            call: sys.log
            args:
                severity: INFO
                data:
                    message: "Nenhuma odd nova — dbt pulado"
                    saved_count: ${saved_count}
        - skip_to_finalize:
            next: finalize

    # ========================================================================
    # FASE 2: dbt enxuto — modelos de odds + Motor de Score 1X2 + Gols O/U + Handicap + BTTS. Cai em finalize ao terminar.
    # Os modelos do Motor usam --select SEM '+' (os facts upstream já são materializados pelos
    # outros workflows; aqui só recalcula devig/corroboração/premissas + os marts fact_value_funnel,
    # fact_value_funnel_selo e fact_value_opportunities). O funil (#95) vem ANTES do board na lista:
    # workflow enumera modelo a modelo, e modelo fora da lista nasce parado — foi assim que uma
    # tabela nova já ficou sem rodar.
    #
    # ⚠️ O `fact_value_funnel_selo` (#96) vem DEPOIS do funil e é ele que torna possível a guarda de
    # imutabilidade: ele grava, uma vez só, a contagem e a soma de nota de cada dia de kickoff que
    # ficou para trás. Fora da lista ele nasce parado e a guarda passa a comparar contra o vazio.
    #
    # ⚠️ Os DOIS são `full_refresh=false` no dbt, e isso é de propósito: a fase de RECOVERY abaixo
    # roda este mesmo `--select` com `--full-refresh`. Sem a trava, a primeira recuperação de deriva
    # determinística apagaria o histórico append-only inteiro — em silêncio, e com o job verde.
    # ========================================================================
    - phase2_dbt:
        try:
            steps:
            - init_job_config:
                assign:
                - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
                - job_full_name: ${"projects/" + project_id + "/locations/us-east1/jobs/dbt-futebol"}
            - execute_cloud_run_job:
                try:
                    call: googleapis.run.v2.projects.locations.jobs.run
                    args:
                        name: ${job_full_name}
                        body:
                            overrides:
                                containerOverrides:
                                    - args: ["dbt", "run", "--select", "stg_futebol_odds", "fact_odds_snapshot", "int_futebol_odds_devig", "int_futebol_corroboracao", "int_futebol_player_importance", "int_futebol_desfalques", "int_futebol_team_form_pit", "int_futebol_premissas_1x2", "int_futebol_premissas_ou", "int_futebol_premissas_ah", "int_futebol_premissas_btts", "int_futebol_premissas_dc", "fact_value_funnel", "fact_value_funnel_selo", "fact_value_opportunities", "--project-dir", "/app/dbt_futebol", "--profiles-dir", "/app/.dbt", "--target", "prod"]
                    result: job_execution_result
                # Retry com backoff exponencial: reexecuta em 429/5xx/timeout/erro de conexão.
                retry:
                    predicate: ${http.default_retry_predicate}
                    max_retries: 3
                    backoff:
                        initial_delay: 5
                        max_delay: 60
                        multiplier: 2
            - log_job_success:
                call: sys.log
                args:
                    severity: INFO
                    data:
                        message: "dbt odds + motor de score rebuild completed"
                        saved_count: ${saved_count}
                        execution_name: ${job_execution_result.name}
        except:
            as: e
            steps:
            - log_job_error:
                call: sys.log
                args:
                    severity: WARNING
                    data:
                        message: "dbt odds rebuild falhou — recovery com --full-refresh"
                        error: ${e.message}
            # RECOVERY: roda o MESMO select com --full-refresh. Resolve o caso DETERMINÍSTICO de
            # drift table<->view (a relação existe no BQ como table mas o modelo virou view, ou
            # vice-versa) — que o retry acima não conserta por reexecutar o comando idêntico.
            # Custo ~0: os 10 modelos são todos table/view (nenhum incremental), então já fazem
            # rebuild completo a cada run; --full-refresh só permite o DROP+CREATE do tipo certo.
            - recover_full_refresh:
                try:
                    call: googleapis.run.v2.projects.locations.jobs.run
                    args:
                        name: ${job_full_name}
                        body:
                            overrides:
                                containerOverrides:
                                    - args: ["dbt", "run", "--select", "stg_futebol_odds", "fact_odds_snapshot", "int_futebol_odds_devig", "int_futebol_corroboracao", "int_futebol_player_importance", "int_futebol_desfalques", "int_futebol_team_form_pit", "int_futebol_premissas_1x2", "int_futebol_premissas_ou", "int_futebol_premissas_ah", "int_futebol_premissas_btts", "int_futebol_premissas_dc", "fact_value_funnel", "fact_value_funnel_selo", "fact_value_opportunities", "--full-refresh", "--project-dir", "/app/dbt_futebol", "--profiles-dir", "/app/.dbt", "--target", "prod"]
                    result: recover_result
                retry:
                    predicate: ${http.default_retry_predicate}
                    max_retries: 3
                    backoff:
                        initial_delay: 5
                        max_delay: 60
                        multiplier: 2
                except:
                    as: e2
                    steps:
                    - log_recover_failed:
                        call: sys.log
                        args:
                            severity: ERROR
                            data:
                                message: "dbt recovery (--full-refresh) também falhou"
                                error: ${e2.message}
                    - handle_job_errors:
                        assign:
                        - workflow_status: "PARTIAL_FAILURE"
            - log_recover_done:
                call: sys.log
                args:
                    severity: ${if(workflow_status == "SUCCESS", "INFO", "WARNING")}
                    data:
                        message: ${if(workflow_status == "SUCCESS", "dbt odds rebuild recuperado via --full-refresh", "dbt odds rebuild falhou mesmo após --full-refresh")}
                        status: ${workflow_status}
                        saved_count: ${saved_count}

    # ========================================================================
    # GATE: só roda o snapshot histórico se o rebuild do mart deu certo (direto
    # ou via recovery --full-refresh). Se as duas tentativas falharam, não faz
    # sentido versionar o mart potencialmente stale — pula direto pro finalize.
    # ========================================================================
    - check_dbt_success:
        switch:
            - condition: ${workflow_status == "SUCCESS"}
              next: phase3_dbt_snapshot
        next: finalize

    # ========================================================================
    # FASE 3: dbt snapshot — versiona fact_value_opportunities_hist (histórico
    # append-only por janela t24h/t1h/t15m). strategy=check só insere uma linha
    # nova quando algo em check_cols mudou (ex.: janela_usada avançou ou o
    # score/edge mudaram); senão não duplica. Mesmo Cloud Run Job dbt-futebol.
    # ========================================================================
    - phase3_dbt_snapshot:
        try:
            steps:
            - execute_snapshot_job:
                try:
                    call: googleapis.run.v2.projects.locations.jobs.run
                    args:
                        name: ${job_full_name}
                        body:
                            overrides:
                                containerOverrides:
                                    - args: ["dbt", "snapshot", "--select", "fact_value_opportunities_hist", "--project-dir", "/app/dbt_futebol", "--profiles-dir", "/app/.dbt", "--target", "prod"]
                    result: snapshot_result
                # Retry com backoff exponencial: reexecuta em 429/5xx/timeout/erro de conexão.
                retry:
                    predicate: ${http.default_retry_predicate}
                    max_retries: 3
                    backoff:
                        initial_delay: 5
                        max_delay: 60
                        multiplier: 2
            - log_snapshot_success:
                call: sys.log
                args:
                    severity: INFO
                    data:
                        message: "Snapshot histórico fact_value_opportunities_hist atualizado"
                        execution_name: ${snapshot_result.name}
        except:
            as: e
            steps:
            - log_snapshot_error:
                call: sys.log
                args:
                    severity: WARNING
                    data:
                        message: "dbt snapshot (fact_value_opportunities_hist) falhou — não bloqueia o workflow"
                        error: ${e.message}
            - handle_snapshot_errors:
                assign:
                - workflow_status: "PARTIAL_FAILURE"

    # FASE 4: guardas de qualidade de dado (spec #22). Passo DEDICADO, depois do board E do
    # histórico — de propósito. Não é `dbt build` na fase 2: teste vermelho em modelo a
    # montante faria o dbt PULAR os modelos a jusante, o mart não reconstruiria e o board
    # congelaria. Guarda de qualidade de dado não pode derrubar o produto.
    #
    # Seleção por TAG e não por nome: guarda nova entra mexendo só no projeto dbt, sem editar
    # este YAML e sem depender do redeploy do workflow — que é justamente o passo que costuma
    # ser esquecido. Tag vazia resolve p/ "nada a fazer", então a ordem de deploy é segura nos
    # dois sentidos.
    #
    # Usa variável de status PRÓPRIA (guardas_status): guarda vermelha reporta no log de
    # conclusão — e por consequência no e-mail diário consolidado, que é o canal de alarme que
    # existe aqui — sem virar PARTIAL_FAILURE do workflow e sem bloquear nada.
    #
    # O `except` abaixo PEGA guarda vermelha. Medido em 2026-08-07, os 3 elos: `dbt test
    # --select tag:guarda` sai com exit 1 quando uma guarda falha (PASS=13 ERROR=1 ->
    # exit 1); container != 0 vira execução Cloud Run FAILED; e o conector jobs.run
    # ESPERA o job (240-280s quando a fase 4 roda, vs 2-3s quando o workflow sai antes) e
    # LEVANTA no FAILED. Sonda `probe-c4-guardas` devolveu {conector_levantou: true,
    # guardas_status: PARTIAL_FAILURE}. O comentário anterior dizia "exit 0 mesmo com
    # ERROR>=1" — isso é do `gcloud run jobs execute` SEM `--wait` (disparo assíncrono),
    # mecanismo diferente do conector, e não vale aqui.
    # ⚠️ maxRetries=1 no job: guarda vermelha roda a suíte 2x antes de falhar (~2x BQ).
    - phase4_dbt_guardas:
        try:
            steps:
            - execute_guardas_job:
                try:
                    call: googleapis.run.v2.projects.locations.jobs.run
                    args:
                        name: ${job_full_name}
                        body:
                            overrides:
                                containerOverrides:
                                    - args: ["dbt", "test", "--select", "tag:guarda", "--project-dir", "/app/dbt_futebol", "--profiles-dir", "/app/.dbt", "--target", "prod"]
                    result: guardas_result
                retry:
                    predicate: ${http.default_retry_predicate}
                    max_retries: 2
                    backoff:
                        initial_delay: 5
                        max_delay: 60
                        multiplier: 2
            - log_guardas_success:
                call: sys.log
                args:
                    severity: INFO
                    data:
                        message: "Guardas de qualidade (tag:guarda) PASSARAM — job verde significa ERROR=0"
                        execution_name: ${guardas_result.name}
        except:
            as: e
            steps:
            - log_guardas_error:
                call: sys.log
                args:
                    severity: WARNING
                    data:
                        message: "GUARDA VERMELHA (ou o job não executou) — reporta no resumo diário; não bloqueia o workflow nem o board. Qual teste falhou: log do job dbt-futebol"
                        error: ${e.message}
            - handle_guardas_errors:
                assign:
                - guardas_status: "PARTIAL_FAILURE"

    - finalize:
        assign:
        - workflow_end_time: ${sys.now()}
        - duration_seconds: ${workflow_end_time - workflow_start_time}

    - log_completion:
        call: sys.log
        args:
            severity: ${if(workflow_status == "SUCCESS", "INFO", "WARNING")}
            data:
                message: "Workflow odds (pregame) completed"
                workflow_name: "workflow_futebol_odds"
                status: ${workflow_status}
                guardas_status: ${guardas_status}
                saved_count: ${saved_count}
                duration_seconds: ${duration_seconds}

    - return_result:
        return:
            status: ${workflow_status}
            guardas_status: ${guardas_status}
            saved_count: ${saved_count}
            duration_seconds: ${duration_seconds}
