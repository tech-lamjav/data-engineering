# ============================================================
# WORKFLOW INJURY REPORT
# Extrai lesões (extract_player_injuries) e executa job dbt-nba
# ============================================================

main:
    steps:

    # ============================================================================
    # INICIALIZAÇÃO
    # ============================================================================
    - init:
        assign:
        - workflow_start_time: ${sys.now()}
        - execution_id: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
        - workflow_status: "SUCCESS"
        - failed_services: []
    
    - log_start:
        call: sys.log
        args:
            severity: INFO
            data:
                message: "Workflow injury report started"
                execution_id: ${execution_id}
                start_time: ${workflow_start_time}

    # ============================================================================
    # FASE 1: Extração de player props (player props)
    # ============================================================================
    - phase1_initial_extraction:
        try:
            steps:
            - call_extract_player_props:
                call: http.get
                args:
                    url: https://extract-player-props-r52p4w2f2a-ue.a.run.app
                    auth:
                        type: OIDC
                    timeout: 1800
            - log_phase1_success:
                call: sys.log
                args:
                    severity: INFO
                    data:
                        message: "Phase 1 completed successfully"
                        phase: "initial_extraction"
        except:
            as: e
            steps:
            - log_phase1_error:
                call: sys.log
                args:
                    severity: ERROR
                    data:
                        message: "Phase 1 encountered errors"
                        phase: "initial_extraction"
                        error: ${e.message}
            - handle_phase1_errors:
                assign:
                - workflow_status: "PARTIAL_FAILURE"
                - failed_services: ${list.concat(failed_services, ["Phase 1 - Some services failed"])}

    # ============================================================================
    # FASE 2: Cloud Run Job execution (dbt-nba)
    # ============================================================================
    - phase2_cloud_run_job:
        try:
            steps:
            - init_job_config:
                assign:
                - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
                - job_name: "dbt-nba"
                - job_location: "us-east1"
                - job_full_name: ${"projects/" + project_id + "/locations/" + job_location + "/jobs/" + job_name}
            - log_job_start:
                call: sys.log
                args:
                    severity: INFO
                    data:
                        message: "Starting Cloud Run Job execution"
                        job_name: ${job_name}
                        job_location: ${job_location}
            - execute_cloud_run_job:
                call: googleapis.run.v2.projects.locations.jobs.run
                args:
                    name: ${job_full_name}
                result: job_execution_result
            - log_job_success:
                call: sys.log
                args:
                    severity: INFO
                    data:
                        message: "Cloud Run Job executed successfully"
                        job_name: ${job_name}
                        execution_name: ${job_execution_result.name}
        except:
            as: e
            steps:
            - log_job_error:
                call: sys.log
                args:
                    severity: ERROR
                    data:
                        message: "Cloud Run Job execution failed"
                        job_name: "dbt-nba"
                        error: ${e.message}
            - handle_job_errors:
                assign:
                - workflow_status: "PARTIAL_FAILURE"
                - failed_services: ${list.concat(failed_services, ["Phase 2 - Cloud Run Job failed"])}

    # ============================================================================
    # FINALIZAÇÃO
    # ============================================================================
    - finalize:
        assign:
        - workflow_end_time: ${sys.now()}
        - duration_seconds: ${workflow_end_time - workflow_start_time}
        - failed_count: ${len(failed_services)}
    
    - log_completion:
        call: sys.log
        args:
            severity: ${if(workflow_status == "SUCCESS", "INFO", "WARNING")}
            data:
                message: "Workflow execution completed"
                status: ${workflow_status}
                duration_seconds: ${duration_seconds}
                failed_services_count: ${failed_count}
    
    - return_result:
        return:
            status: ${workflow_status}
            duration_seconds: ${duration_seconds}
            failed_services: ${failed_services}