# ============================================================
# WORKFLOW FUTEBOL PREDICTIONS (pré-jogo / T-2h)
# Poll das PREVISÕES pré-jogo do algoritmo da própria API-Football (/predictions) —
# BASELINE de comparação p/ avaliar um modelo próprio depois (não é produto). 1 chamada
# por jogo numa janela T-2h: o extractor bucketa cada jogo NS pela proximidade do kickoff
# (FUTEBOL_PREDICTIONS_WINDOWS) e grava 1 arquivo por fixture com skip-if-exists (1
# captura/jogo). Se algo novo foi coletado, rebuild ENXUTO dos modelos de predictions.
#
# Disparado pelo Cloud Scheduler a cada ~15min (SA schedulerde@, tem workflows.invoker).
# Sem notificação por email no sucesso (poll de alta frequência). Coleta FORWARD-ONLY
# (previsão de jogo passado não é reconstruível).
#
# O dbt usa --select SEM '+' (enxuto): a external table raw_futebol_predictions é a fonte;
# o gate saved_count>0 garante que só roda com arquivo novo no GCS (external table não-vazia).
# ============================================================

main:
    steps:
    - init:
        assign:
        - workflow_start_time: ${sys.now()}
        - execution_id: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
        - workflow_status: "SUCCESS"
        - saved_count: 0

    - log_start:
        call: sys.log
        args:
            severity: INFO
            data:
                message: "Workflow predictions (pregame) started"
                workflow_name: "workflow_futebol_predictions"
                execution_id: ${execution_id}

    # ========================================================================
    # FASE 1: Extração das previsões (janela T-2h numa passada — sem query param)
    # ========================================================================
    - phase1_extract_predictions:
        try:
            steps:
            - call_extract_predictions:
                try:
                    call: http.get
                    args:
                        # URL segue o padrão dos demais serviços futebol (confirmar pós-deploy)
                        url: https://extract-predictions-r52p4w2f2a-ue.a.run.app
                        auth:
                            type: OIDC
                        timeout: 1800
                    result: predictions_result
                # Retry com backoff exponencial: reexecuta em 429/5xx/timeout/erro de conexão.
                retry:
                    predicate: ${http.default_retry_predicate}
                    max_retries: 3
                    backoff:
                        initial_delay: 5
                        max_delay: 60
                        multiplier: 2
            - read_saved_count:
                assign:
                - saved_count: ${default(map.get(predictions_result.body, "saved_count"), 0)}
            - log_phase1_success:
                call: sys.log
                args:
                    severity: INFO
                    data:
                        message: "Predictions extraction completed"
                        saved_count: ${saved_count}
        except:
            as: e
            steps:
            - log_phase1_error:
                call: sys.log
                args:
                    severity: ERROR
                    data:
                        message: "Predictions extraction failed"
                        error: ${e.message}
            - handle_phase1_errors:
                assign:
                - workflow_status: "PARTIAL_FAILURE"

    # ========================================================================
    # GATE: só roda o dbt se algo novo foi coletado (saved_count > 0).
    # ========================================================================
    - check_new_predictions:
        switch:
            - condition: ${saved_count > 0}
              next: phase2_dbt
        next: skip_dbt

    - skip_dbt:
        steps:
        - log_skip:
            call: sys.log
            args:
                severity: INFO
                data:
                    message: "Nenhuma previsão nova — dbt pulado"
                    saved_count: ${saved_count}
        - skip_to_finalize:
            next: finalize

    # ========================================================================
    # FASE 2: dbt enxuto (só os 2 modelos de predictions). Cai em finalize ao terminar.
    # ========================================================================
    - phase2_dbt:
        try:
            steps:
            - init_job_config:
                assign:
                - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
                - job_full_name: ${"projects/" + project_id + "/locations/us-east1/jobs/dbt-futebol"}
            - execute_cloud_run_job:
                try:
                    call: googleapis.run.v2.projects.locations.jobs.run
                    args:
                        name: ${job_full_name}
                        body:
                            overrides:
                                containerOverrides:
                                    - args: ["dbt", "run", "--select", "stg_futebol_predictions", "fact_predictions_api", "--project-dir", "/app/dbt_futebol", "--profiles-dir", "/app/.dbt", "--target", "prod"]
                    result: job_execution_result
                # Retry com backoff exponencial: reexecuta em 429/5xx/timeout/erro de conexão.
                retry:
                    predicate: ${http.default_retry_predicate}
                    max_retries: 3
                    backoff:
                        initial_delay: 5
                        max_delay: 60
                        multiplier: 2
            - log_job_success:
                call: sys.log
                args:
                    severity: INFO
                    data:
                        message: "dbt predictions rebuild completed"
                        saved_count: ${saved_count}
                        execution_name: ${job_execution_result.name}
        except:
            as: e
            steps:
            - log_job_error:
                call: sys.log
                args:
                    severity: WARNING
                    data:
                        message: "dbt predictions rebuild falhou — recovery com --full-refresh"
                        error: ${e.message}
            # RECOVERY: reexecuta o MESMO select com --full-refresh. Resolve o caso DETERMINÍSTICO de
            # drift table<->view (relação existe no BQ como table mas o modelo virou view, ou vice-versa)
            # — que o retry acima não conserta por reexecutar o comando idêntico. Custo ~0: dbt_futebol
            # não tem modelo incremental, então todo table/view já faz rebuild completo a cada run.
            - recover_full_refresh:
                try:
                    call: googleapis.run.v2.projects.locations.jobs.run
                    args:
                        name: ${job_full_name}
                        body:
                            overrides:
                                containerOverrides:
                                    - args: ["dbt", "run", "--select", "stg_futebol_predictions", "fact_predictions_api", "--full-refresh", "--project-dir", "/app/dbt_futebol", "--profiles-dir", "/app/.dbt", "--target", "prod"]
                    result: recover_result
                retry:
                    predicate: ${http.default_retry_predicate}
                    max_retries: 3
                    backoff:
                        initial_delay: 5
                        max_delay: 60
                        multiplier: 2
                except:
                    as: e2
                    steps:
                    - log_recover_failed:
                        call: sys.log
                        args:
                            severity: ERROR
                            data:
                                message: "dbt recovery (--full-refresh) também falhou"
                                error: ${e2.message}
                    - handle_job_errors:
                        assign:
                        - workflow_status: "PARTIAL_FAILURE"
            - log_recover_done:
                call: sys.log
                args:
                    severity: ${if(workflow_status == "SUCCESS", "INFO", "WARNING")}
                    data:
                        message: ${if(workflow_status == "SUCCESS", "dbt predictions rebuild recuperado via --full-refresh", "dbt predictions rebuild falhou mesmo após --full-refresh")}
                        status: ${workflow_status}

    - finalize:
        assign:
        - workflow_end_time: ${sys.now()}
        - duration_seconds: ${workflow_end_time - workflow_start_time}

    - log_completion:
        call: sys.log
        args:
            severity: ${if(workflow_status == "SUCCESS", "INFO", "WARNING")}
            data:
                message: "Workflow predictions (pregame) completed"
                workflow_name: "workflow_futebol_predictions"
                status: ${workflow_status}
                saved_count: ${saved_count}
                duration_seconds: ${duration_seconds}

    - return_result:
        return:
            status: ${workflow_status}
            saved_count: ${saved_count}
            duration_seconds: ${duration_seconds}
