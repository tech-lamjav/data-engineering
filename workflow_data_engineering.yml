# ============================================================
# WORKFLOW DATA ENGINEERING
# Extração paralela + dbt + notificação por email
# GCP Workflows limita a 10 branches paralelas — serviços divididos em 2 blocos de 6
# ============================================================

main:
    steps:

    # ============================================================================
    # INICIALIZAÇÃO
    # ============================================================================
    - init:
        assign:
        - workflow_start_time: ${sys.now()}
        - execution_id: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
        - workflow_status: "SUCCESS"
        - failed_services: []
        - dbt_ok: true

    - log_start:
        call: sys.log
        args:
            severity: INFO
            data:
                message: "Workflow execution started"
                workflow_name: "workflow_data_engineering"
                execution_id: ${execution_id}
                start_time: ${workflow_start_time}

    # ============================================================================
    # FASE 1A: Primeiros 6 serviços em paralelo
    # ============================================================================
    - phase1a:
        steps:
        - run_phase1a:
            parallel:
              shared: [failed_services, workflow_status]
              branches:
                - extract_active_players:
                    steps:
                    - call_extract_active_players:
                        try:
                            call: http.get
                            args:
                                url: https://extract-active-players-r52p4w2f2a-ue.a.run.app
                                auth:
                                    type: OIDC
                                timeout: 1800
                        except:
                            as: e
                            steps:
                            - handle_active_players_error:
                                assign:
                                - workflow_status: "PARTIAL_FAILURE"
                                - failed_services: ${list.concat(failed_services, ["extract-active-players"])}
                - extract_game_player_stats:
                    steps:
                    - call_extract_game_player_stats:
                        try:
                            call: http.get
                            args:
                                url: https://extract-game-player-stats-r52p4w2f2a-ue.a.run.app
                                auth:
                                    type: OIDC
                                timeout: 1800
                        except:
                            as: e
                            steps:
                            - handle_game_player_stats_error:
                                assign:
                                - workflow_status: "PARTIAL_FAILURE"
                                - failed_services: ${list.concat(failed_services, ["extract-game-player-stats"])}
                - extract_game_player_stats_period:
                    steps:
                    - call_extract_game_player_stats_period:
                        try:
                            call: http.get
                            args:
                                url: https://extract-game-player-stats-period-r52p4w2f2a-ue.a.run.app
                                auth:
                                    type: OIDC
                                timeout: 1800
                        except:
                            as: e
                            steps:
                            - handle_game_player_stats_period_error:
                                assign:
                                - workflow_status: "PARTIAL_FAILURE"
                                - failed_services: ${list.concat(failed_services, ["extract-game-player-stats-period"])}
                - extract_games:
                    steps:
                    - call_extract_games:
                        try:
                            call: http.get
                            args:
                                url: https://extract-games-r52p4w2f2a-ue.a.run.app
                                auth:
                                    type: OIDC
                                timeout: 1800
                        except:
                            as: e
                            steps:
                            - handle_games_error:
                                assign:
                                - workflow_status: "PARTIAL_FAILURE"
                                - failed_services: ${list.concat(failed_services, ["extract-games"])}
                - extract_player_injuries:
                    steps:
                    - call_extract_player_injuries:
                        try:
                            call: http.get
                            args:
                                url: https://extract-player-injuries-r52p4w2f2a-ue.a.run.app
                                auth:
                                    type: OIDC
                                timeout: 1800
                        except:
                            as: e
                            steps:
                            - handle_player_injuries_error:
                                assign:
                                - workflow_status: "PARTIAL_FAILURE"
                                - failed_services: ${list.concat(failed_services, ["extract-player-injuries"])}
                - extract_player_props_draftkings:
                    steps:
                    - call_extract_player_props_draftkings:
                        try:
                            call: http.get
                            args:
                                url: https://extract-player-props-draftkings-r52p4w2f2a-ue.a.run.app
                                auth:
                                    type: OIDC
                                timeout: 1800
                        except:
                            as: e
                            steps:
                            - handle_player_props_draftkings_error:
                                assign:
                                - workflow_status: "PARTIAL_FAILURE"
                                - failed_services: ${list.concat(failed_services, ["extract-player-props-draftkings"])}

    # ============================================================================
    # FASE 1B: Próximos 6 serviços em paralelo
    # ============================================================================
    - phase1b:
        steps:
        - run_phase1b:
            parallel:
              shared: [failed_services, workflow_status]
              branches:
                - extract_player_props_caesars:
                    steps:
                    - call_extract_player_props_caesars:
                        try:
                            call: http.get
                            args:
                                url: https://extract-player-props-caesars-r52p4w2f2a-ue.a.run.app
                                auth:
                                    type: OIDC
                                timeout: 1800
                        except:
                            as: e
                            steps:
                            - handle_player_props_caesars_error:
                                assign:
                                - workflow_status: "PARTIAL_FAILURE"
                                - failed_services: ${list.concat(failed_services, ["extract-player-props-caesars"])}
                - extract_player_props_betrivers:
                    steps:
                    - call_extract_player_props_betrivers:
                        try:
                            call: http.get
                            args:
                                url: https://extract-player-props-betrivers-r52p4w2f2a-ue.a.run.app
                                auth:
                                    type: OIDC
                                timeout: 1800
                        except:
                            as: e
                            steps:
                            - handle_player_props_betrivers_error:
                                assign:
                                - workflow_status: "PARTIAL_FAILURE"
                                - failed_services: ${list.concat(failed_services, ["extract-player-props-betrivers"])}
                - extract_season_averages:
                    steps:
                    - call_extract_season_averages:
                        try:
                            call: http.get
                            args:
                                url: https://extract-season-averages-r52p4w2f2a-ue.a.run.app
                                auth:
                                    type: OIDC
                                timeout: 1800
                        except:
                            as: e
                            steps:
                            - handle_season_averages_error:
                                assign:
                                - workflow_status: "PARTIAL_FAILURE"
                                - failed_services: ${list.concat(failed_services, ["extract-season-averages"])}
                - extract_team_standings:
                    steps:
                    - call_extract_team_standings:
                        try:
                            call: http.get
                            args:
                                url: https://extract-team-standings-r52p4w2f2a-ue.a.run.app
                                auth:
                                    type: OIDC
                                timeout: 1800
                        except:
                            as: e
                            steps:
                            - handle_team_standings_error:
                                assign:
                                - workflow_status: "PARTIAL_FAILURE"
                                - failed_services: ${list.concat(failed_services, ["extract-team-standings"])}
                - extract_team_season_averages:
                    steps:
                    - call_extract_team_season_averages:
                        try:
                            call: http.get
                            args:
                                url: https://extract-team-season-averages-r52p4w2f2a-ue.a.run.app
                                auth:
                                    type: OIDC
                                timeout: 1800
                        except:
                            as: e
                            steps:
                            - handle_team_season_averages_error:
                                assign:
                                - workflow_status: "PARTIAL_FAILURE"
                                - failed_services: ${list.concat(failed_services, ["extract-team-season-averages"])}
                - extract_betting_odds:
                    steps:
                    - call_extract_betting_odds:
                        try:
                            call: http.get
                            args:
                                url: https://extract-betting-odds-r52p4w2f2a-ue.a.run.app
                                auth:
                                    type: OIDC
                                timeout: 1800
                        except:
                            as: e
                            steps:
                            - handle_betting_odds_error:
                                assign:
                                - workflow_status: "PARTIAL_FAILURE"
                                - failed_services: ${list.concat(failed_services, ["extract-betting-odds"])}
                - extract_game_player_advanced_stats:
                    steps:
                    - call_extract_game_player_advanced_stats:
                        try:
                            call: http.get
                            args:
                                url: https://extract-game-player-advanced-stats-r52p4w2f2a-ue.a.run.app
                                auth:
                                    type: OIDC
                                timeout: 1800
                        except:
                            as: e
                            steps:
                            - handle_game_player_advanced_stats_error:
                                assign:
                                - workflow_status: "PARTIAL_FAILURE"
                                - failed_services: ${list.concat(failed_services, ["extract-game-player-advanced-stats"])}

    # ============================================================================
    # FASE 2: Cloud Run Job execution (dbt-nba)
    # ============================================================================
    - phase2_cloud_run_job:
        try:
            steps:
            - init_job_config:
                assign:
                - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
                - job_name: "dbt-nba"
                - job_location: "us-east1"
                - job_full_name: ${"projects/" + project_id + "/locations/" + job_location + "/jobs/" + job_name}

            - log_job_start:
                call: sys.log
                args:
                    severity: INFO
                    data:
                        message: "Starting Cloud Run Job execution"
                        job_name: ${job_name}

            - execute_cloud_run_job:
                call: googleapis.run.v2.projects.locations.jobs.run
                args:
                    name: ${job_full_name}
                result: job_execution_result

            - log_job_success:
                call: sys.log
                args:
                    severity: INFO
                    data:
                        message: "Cloud Run Job executed successfully"
                        job_name: ${job_name}
                        execution_name: ${job_execution_result.name}
        except:
            as: e
            steps:
            - log_job_error:
                call: sys.log
                args:
                    severity: ERROR
                    data:
                        message: "Cloud Run Job execution failed"
                        job_name: "dbt-nba"
                        error: ${e.message}
            - handle_job_errors:
                assign:
                - workflow_status: "PARTIAL_FAILURE"
                - failed_services: ${list.concat(failed_services, ["dbt-nba"])}
                - dbt_ok: false

    # ============================================================================
    # FASE 3: Sync BigQuery marts -> Supabase Postgres (PRD + DEV, sequencial)
    # try/except independentes: falha em um ambiente não bloqueia o outro.
    # GATE: o sync PRD só roda se o dbt (fase 2) teve sucesso — não publicar marts
    # potencialmente desatualizadas/parciais em produção quando o dbt falhou.
    # (DEV é deixado rodando de propósito; gate análogo pode ser aplicado se desejado.)
    # ============================================================================
    - phase3_sync_supabase_prd_gate:
        switch:
            - condition: ${dbt_ok}
              next: phase3_sync_supabase_prd
        next: skip_phase3_prd_sync

    - phase3_sync_supabase_prd:
        try:
            steps:
            - call_sync_prd:
                call: http.get
                args:
                    url: https://sync-bq-to-postgres-r52p4w2f2a-ue.a.run.app?env=prd
                    auth:
                        type: OIDC
                        audience: https://sync-bq-to-postgres-r52p4w2f2a-ue.a.run.app
                    timeout: 900
            - log_phase3_prd_success:
                call: sys.log
                args:
                    severity: INFO
                    data:
                        message: "Phase 3 sync PRD completed successfully"
        except:
            as: e
            steps:
            - log_phase3_prd_error:
                call: sys.log
                args:
                    severity: ERROR
                    data:
                        message: "Phase 3 sync PRD failed"
                        error: ${e.message}
            - handle_phase3_prd_errors:
                assign:
                - workflow_status: "PARTIAL_FAILURE"
                - failed_services: ${list.concat(failed_services, ["sync-bq-to-postgres[prd]"])}
        next: phase3_sync_supabase_dev

    # Alcançado apenas quando o gate desvia (dbt falhou): registra o skip e segue p/ o DEV.
    - skip_phase3_prd_sync:
        steps:
        - log_skip_phase3_prd:
            call: sys.log
            args:
                severity: WARNING
                data:
                    message: "Phase 3 sync PRD PULADO: dbt-nba falhou; marts nao publicadas em producao"
                    failed_services: ${failed_services}
        - mark_phase3_prd_skipped:
            assign:
            - failed_services: ${list.concat(failed_services, ["sync-bq-to-postgres[prd]:skipped(dbt-failed)"])}

    - phase3_sync_supabase_dev:
        try:
            steps:
            - call_sync_dev:
                call: http.get
                args:
                    url: https://sync-bq-to-postgres-r52p4w2f2a-ue.a.run.app?env=dev
                    auth:
                        type: OIDC
                        audience: https://sync-bq-to-postgres-r52p4w2f2a-ue.a.run.app
                    timeout: 900
            - log_phase3_dev_success:
                call: sys.log
                args:
                    severity: INFO
                    data:
                        message: "Phase 3 sync DEV completed successfully"
        except:
            as: e
            steps:
            - log_phase3_dev_error:
                call: sys.log
                args:
                    severity: ERROR
                    data:
                        message: "Phase 3 sync DEV failed"
                        error: ${e.message}
            - handle_phase3_dev_errors:
                assign:
                - workflow_status: "PARTIAL_FAILURE"
                - failed_services: ${list.concat(failed_services, ["sync-bq-to-postgres[dev]"])}

    # ============================================================================
    # FINALIZAÇÃO
    # ============================================================================
    - finalize:
        assign:
        - workflow_end_time: ${sys.now()}
        - duration_seconds: ${workflow_end_time - workflow_start_time}
        - failed_count: ${len(failed_services)}

    - log_completion:
        call: sys.log
        args:
            severity: ${if(workflow_status == "SUCCESS", "INFO", "WARNING")}
            data:
                message: "Workflow execution completed"
                workflow_name: "workflow_data_engineering"
                status: ${workflow_status}
                duration_seconds: ${duration_seconds}
                failed_services: ${failed_services}
                failed_count: ${failed_count}

    - return_result:
        return:
            status: ${workflow_status}
            duration_seconds: ${duration_seconds}
            failed_services: ${failed_services}
